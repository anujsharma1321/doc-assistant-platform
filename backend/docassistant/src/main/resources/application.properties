# ==========================================
# Application Configuration
# ==========================================
spring.application.name=docassistant

# ==========================================
# PostgreSQL Database Configuration
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/${DB_NAME:docassistant}
spring.datasource.username=${DB_USER:docassistant}
spring.datasource.password=${DB_PASSWORD:local_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# Hibernate / JPA Configuration
# ==========================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Flyway Database Migration
# ==========================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==========================================
# Server Configuration
# ==========================================
server.port=8080

# ==========================================
# Spring Boot Actuator
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
